# ================================================================
#  IPTV 直播源 自动采集 / 有效性检测 / 自动剔除 / 发布   配置
# ================================================================
#  改完直接重跑 `python main.py run` 即可，不需要动代码。
# ================================================================

# ---------------------------------------------------------------
# 1. 采集源（M3U / TXT 皆可）
# ---------------------------------------------------------------
# enabled : 是否启用
# filter  : 该源自己的筛选模式，覆盖下面的 filter.mode
#             all     = 这个源里的频道全都要
#             include = 按 include_keywords 筛
#
# 关于 ghproxy.net：本机访问 raw.githubusercontent.com 会间歇性失败，
# 所以 GitHub 上的源统一走 ghproxy 镜像；同时保留直连版本作为备份，
# 两个都配、哪条通用哪条，重复的 URL 会被自动去重。
# 单个源失败不会影响整体，不用管。
sources:
  # ===== 手工维护：自动采集找不到但实测可用的频道 =====
  # 目前里面是长春综合（吉视官方省级频道已改成 token 鉴权，公开拿不到）。
  # 详见该文件里的注释。
  - name: local-extra
    url: config/sources/local.m3u
    enabled: true
    filter: include

  # ===== 主力：中文频道（央卫全覆盖，实测存活率最高）=====
  # best-fan 的列表上游已做过可用性筛选，实测存活率：
  #   cn_cctv 78% / cn_province 90% / cn_all 85%
  # 这是解决「央视和卫视不全」的关键源。
  - name: bestfan-cctv
    url: https://ghproxy.net/https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_cctv.m3u8
    enabled: true
    filter: include
  - name: bestfan-province
    url: https://ghproxy.net/https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_province.m3u8
    enabled: true
    filter: include
  - name: bestfan-all
    url: https://ghproxy.net/https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_all.m3u8
    enabled: true
    filter: include
  # 直连备份（GitHub Actions 上更快；本机连不上会自动忽略）
  - name: bestfan-all-direct
    url: https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_all.m3u8
    enabled: true
    filter: include

  # ===== vbskycn/iptv：国内可直连大源，每日更新 =====
  # 官网 https://live.zbds.top/（订阅地址见其页面），覆盖央视/卫视/地方/电影等。
  # iptv.hacks.tools 是同一项目的镜像，不重复添加。
  # 注意：这是一个全量杂源（央视/卫视/县级台/风景摄像头混在一起），
  #       故 filter: include，按 include_keywords 筛掉县级台、风景摄像头等噪音，
  #       只保留央视/卫视/体育/电影等核心频道。
  # 说明：该源另提供 IPv6 版本（tv/iptv6.m3u），需要 IPv6 网络才建议启用。
  - name: vbskycn-ipv4
    url: https://live.zbds.top/tv/iptv4.m3u
    enabled: true
    filter: include
  # GitHub 加速备份（live.zbds.top 域名被污染时走这条）
  - name: vbskycn-ipv4-gh
    url: https://gh-proxy.com/raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.m3u
    enabled: true
    filter: include

  # ===== 补充：地方台合集（含吉林省台、各地市台）=====
  # 注意：这份列表里部分频道用的是已废弃域名（如 stream1.jlntv.cn），
  # 会被探测自动剔除，属正常现象。
  - name: chinaiptv-cntv
    url: https://ghproxy.net/https://raw.githubusercontent.com/hujingguang/ChinaIPTV/main/cnTV1_ALL.m3u8
    enabled: true
    filter: include

  # ===== 国际 / 体育补充 =====
  - name: iptv-org-sports
    url: https://iptv-org.github.io/iptv/categories/sports.m3u
    enabled: true
    filter: include
  - name: iptv-org-cn
    url: https://iptv-org.github.io/iptv/countries/cn.m3u
    enabled: true
    filter: include
  - name: iptv-org-hk
    url: https://iptv-org.github.io/iptv/countries/hk.m3u
    enabled: true
    filter: include
  - name: iptv-org-tw
    url: https://iptv-org.github.io/iptv/countries/tw.m3u
    enabled: true
    filter: include
  - name: iptv-org-zho
    url: https://iptv-org.github.io/iptv/languages/zho.m3u
    enabled: true
    filter: include
  # 国际新闻台（BBC / Al Jazeera / France 24 / DW / Sky News / Euronews 等）
  # 需要 include_keywords 里命中 bbc/news 等词才会被保留，见下方 filter 段。
  - name: iptv-org-news
    url: https://iptv-org.github.io/iptv/categories/news.m3u
    enabled: true
    filter: include

  # ===== 未启用 =====
  # fanmingming 的流是广东联通源，带会过期的 Authinfo token，实测存活率仅 2%，
  # 价值在于它的台标和 EPG（见下面 output 段，已经直接引用）。
  - name: fanmingming-index
    url: https://ghproxy.net/https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/index.m3u
    enabled: false
    filter: include
  - name: iptv-org-index
    url: https://iptv-org.github.io/iptv/index.m3u
    enabled: false
    filter: include

# ---------------------------------------------------------------
# 2. 频道筛选
# ---------------------------------------------------------------
filter:
  # include = 只保留命中 include_keywords 的频道（快、精）
  # all     = 全部保留（慢、杂）
  mode: include

  include_keywords:
    # 央视 / 国字头（含 CCTV 全套：CCTV6电影/CCTV8电视剧/CCTV14少儿等因含 cctv 自动保留）
    - cctv
    - cgtn
    - 央视
    - 中央电视
    # 卫视（全国省级卫视）
    - 卫视
    # 吉林省级 / 长春市级地方台
    - 吉林
    - 长春
    - 吉视
    # 港澳台
    - 翡翠
    - 明珠
    - 无线
    # 不要写裸的 tvb：它是子串，会把 FTV (Bolivia)（ftvbolivia）、
    # Red Bull TV BR（redbulltvbr）里的 “tvb” 也命中。
    # TVB 各台靠 _EN2ZH_EXACT 本地化成翡翠台/明珠台/无线新闻台，
    # 再被上面的「翡翠 / 明珠 / 无线」命中，不需要这个短词。
    - 凤凰
    - 东森
    - 中天
    - 三立
    - 民视
    - 台视
    - 华视
    - 中视
    - 亚视
    - 澳视
    - 莲花
    - 星空
    - 纬来
    - 龙华
    - 爱尔达
    - 靖天
    - 香港
    - 澳门
    - 台湾
    # 港澳台（iptv-org 的英文名，补充关键词）
    # 注意：不要写 jade / pearl / phoenix 这种宽泛词——
    # jade 会把黎巴嫩的 Al Jadeed、Golden Jade 一起捞进来，
    # pearl 会捞到 “98.1 Pearl FM”，phoenix 会捞到美国凤凰城的地方台。
    # TVB Jade / TVB Pearl / Phoenix Hong Kong 会经本地化名
    # （翡翠台 / 明珠台 / 凤凰卫视香港台）被上面的中文词命中，不需要这些英文词。
    - hong kong
    - macau
    - viutv
    # 体育（含天空体育 Sky Sports）
    - 体育
    - 足球
    - 篮球
    - 网球
    - 台球
    - 赛车
    - 围棋
    - 赛事
    - sports
    - sport
    - espn
    - 五星
    - 劲爆
    - 天元
    - nba
    - 中超
    - 英超
    - 西甲
    - 高尔夫
    - golf
    - 天空
    - sky sports
    # 体育（iptv-org 的英文体育台，补充关键词）
    # arena / premier 太通用，会把 TeleArena、Paris Premiere、TF1 这种
    # 非体育频道也捞进来，所以不列。
    - bein
    - dazn
    - fox sports
    # 不要写裸的 f1：它会命中 TF1（法一）。
    - nfl
    - nhl
    - mlb
    - ufc
    - boxing

  # 国际新闻**不在这里列关键词**，改用下面的 categories[国际新闻].exact 精确名单。
  # 原因：bbc / cnn / dw / cnbc / cna 这些通配词会把 BBC Earth、BBC Drama、
  # BBC One、CNBC Awaaz、CNN TURK、DW Arabic 之类非新闻/非英语频道一起捞进来
  # （实测捞了 87 个）。精确名单可控得多。

  exclude_keywords:
    - 测试
    - test
    - 广告
    - 已停播
    # 提示频道 / 教育台 / 杂台（用户不需要）
    - 支持作者
    - 教育
    - 熊猫直播
    - 苏州4K
    # ---- 吉林地级市台（只保留长春市级 + 省级）----
    - 白城
    - 四平
    - 通化
    - 白山
    - 松原
    - 辽源
    - 梅河口
    - 公主岭
    # 延边州台（精确词，避免误删「延边卫视」）
    - 延边一套
    - 延边二套
    - 延边综合
    - 延吉
    # ---- 吉林县级台（长春代管县级市/县也一并排除，只留长春市区台）----
    - 东丰
    - 双辽
    - 柳河
    - 桦甸
    - 汪清
    - 磐石
    - 靖宇
    - 龙井
    - 敦化
    - 辉南
    - 舒兰
    - 珲春
    - 图们
    - 和龙
    - 安图
    - 抚松
    - 德惠
    - 榆树
    - 农安
    # ---- 风景摄像头 / 非电视频道 ----
    - 中央电视塔
    - 雪山
    - 古城
    - 全景
    - 景区
    - 瀑布
    - 沙滩
    - 航拍
    - 摄像头
    - 山顶
    - 大容山
    # 英文名的地方台（iptv-org 用英文名，中文关键词匹配不到）
    - baicheng
    - siping

  # 命中这些 URL 片段的直接丢弃
  exclude_url_keywords: []

  # ---------- 地方台过滤 ----------
  # 有些源（如 chinaiptv）用 group-title="浙江台"/"黑龙江台"/"吉林台" 这种形式
  # 组织地方台，里面混杂了大量县级台。对吉林用户来说「浙江上虞新闻综合频道」
  # 这类频道只是噪声。
  # 规则：group 以 local_group_suffix 结尾且不是卫视台的，视为地方台，
  #       只有 group 名字命中 local_keep 才保留。
  local_group_suffix: 台
  local_group_exempt:
    - 卫视台
    - 央视
    - 港澳台
  local_keep:
    - 吉林
    - 长春
    - 吉视
  # 不想过滤地级市/县级台就改成 false
  local_filter_enabled: true

  # ---------- 整类丢弃 ----------
  # 这里列出的分类，既不参与探测、也不会出现在列表里（省时又省事）。
  # 体育：iptv-org sports 那批国际体育台（ESPN/NBA TV/beIN 等）看着很全，
  #       但国内直连几乎都卡，留着反而把真正能看的频道挤下去。
  #       注意 CCTV-5 / CCTV-5+ 属于「央视」，不受影响。
  # 想恢复就把列表清空：drop_categories: []
  drop_categories:
    - 体育

# ---------------------------------------------------------------
# 3. 频道分类（决定 group-title）
# ---------------------------------------------------------------
# 匹配规则：按下面顺序，命中第一条即归类。
# 央视 放在最前面，这样 CCTV-5 / CCTV-5+ 归到「央视」而不是「体育」，
# 保证央视那组是完整的 1~17。其它体育频道（五星体育、ESPN 等）仍归体育。
categories:
  - name: 央视
    keywords: [cctv, cgtn, 央视, 中央电视]
  # 港澳台放「卫视」之前，这样「凤凰卫视」「香港卫视」归港澳台而非卫视
  # 不要写 jade / pearl / phoenix / 中视 / 亚视 这种宽泛词：
  #   jade → 黎巴嫩 Al Jadeed、Golden Jade；pearl → “98.1 Pearl FM”（广播）；
  #   phoenix → 美国凤凰城地方台 KNXV。
  # TVB Jade / TVB Pearl / Phoenix Hong Kong 会经本地化名
  # （翡翠台 / 明珠台 / 凤凰卫视香港台）被中文词命中，不需要这些英文词。
  - name: 港澳台
    keywords: [翡翠, 明珠, 无线, 凤凰, 东森, 中天, 三立, 民视, 台视, 华视, 亚视, 澳视, 莲花, 星空, 纬来, 龙华, 爱尔达, 靖天, 香港, 澳门, 台湾, viutv]
  - name: 卫视
    keywords: [卫视]
  - name: 吉林
    # 吉林省台（吉视系列等）。排在「卫视」后，吉林卫视/延边卫视仍归卫视。
    # 目前上游没有可用的省台（吉视已改成 token 鉴权），所以这组可能是空的——
    # 保留着，以后出现了新源会自动归到这里。
    keywords: [吉视, 吉林]
  - name: 长春
    # 长春市级台（长春综合/长春新闻等）
    keywords: [长春]
  - name: 体育
    # 央视5/5+已在「央视」组；这里收五星/劲爆/ESPN/天空体育等其它体育台。
    # 注：filter.drop_categories 里已经把「体育」整类丢弃，这组只是为了
    # 以后想恢复时改一个开关即可，不用重写规则。
    keywords: [体育, 足球, 篮球, 网球, 台球, 赛车, 围棋, 赛事, 五星, 劲爆, 天元, espn, sports, sport, golf, nba, 中超, 英超, 西甲, 天空, sky sports]
  - name: 国际新闻
    # exact = 精确频道名（忽略大小写与画质标注，名称要完整相同）。
    # 只保留最主流电视台的**英语主频**。不用通配关键词，因为
    # bbc / cnbc / cna 这类词会把 BBC Earth、BBC Drama、BBC One、
    # CNBC Awaaz、CNN TURK 一起捞进来（实测捞了 87 个）。
    # 想增减电视台，直接改下面这个名单即可。
    exact:
      - BBC News              # 英国
      - CNN                   # 美国
      - CNN International
      - Al Jazeera English    # 卡塔尔
      - France 24 English     # 法国
      - DW English            # 德国
      - Euronews English      # 欧盟
      - Sky News              # 英国
      - Reuters TV            # 英国
      - NHK World-Japan       # 日本
      - CNA                   # 新加坡（Channel NewsAsia）
      - CNA (Singapore)
      - Arirang TV            # 韩国
      - Bloomberg TV          # 美国（财经）
      - CNBC UK               # 美国/英国（财经）
      - NBC News NOW          # 美国
      - Fox News Channel      # 美国
    keywords: []
  - name: 其他
    keywords: []

# 输出时的分组先后顺序（未列出的分组排最后）
output_order: [央视, 卫视, 吉林, 长春, 港澳台, 国际新闻, 其他]

# ---------------------------------------------------------------
# 4. 频道名归一化
# ---------------------------------------------------------------
normalize:
  # 把不同写法合并成同一频道的补充别名，格式 "归一化键": "显示名"
  display_overrides: {}
  # 手工补充别名：把左侧写法并入右侧频道键（子串匹配，键写规范化后的形式）
  aliases:
    # CNA = Channel NewsAsia（新加坡）。同一个台在不同源里写成
    # “CNA” / “CNA (Singapore)”，不归并的话列表里会出现两条。
    cnasingapore: cna

# ---------------------------------------------------------------
# 5. 网络与探测
# ---------------------------------------------------------------
network:
  concurrency: 200        # 并发探测数，本机 200 稳；GitHub Actions 用 120
  timeout: 8.0            # 单请求空闲超时（秒）
  connect_timeout: 5.0
  retries: 1              # 失败重试次数
  verify_ssl: false       # 很多公开流证书不规范
  max_probe: 4000         # 单次最多探测多少条（0 = 不限）
  # 单条流探测的墙钟硬上限（含重试），防止慢速流拖死整轮。
  # 第一阶段只读 64KB，用不了这么久；设太大反而会出现「进度条卡在 99%」的长尾
  # （曾经设 70，乘以重试 2 次 = 单条最多 140 秒，5 条挂死的流就能堵住整轮）。
  total_timeout: 25
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

validate:
  deep: true              # 深检：HLS 继续拉分片确认真能出流
  manifest_max_bytes: 524288
  segment_bytes: 65536    # 非 HLS 流读多少字节做魔数校验
  segment_timeout: 8.0
  request_hard_timeout: 25   # 单个 HTTP 请求的墙钟硬上限（秒）
  min_segment_bytes: 1024
  allowed_kinds: [hls, ts, mp4, flv, dash, audio]
  # 广播电台（纯音频 HLS）直接判死。
  # cnr.cn 这类卫星播流、以及不少地方台都会用 HLS 分发音频，
  # 速度还很快、看起来像好源，但点开只有声音没画面。
  # 例：吉林乡村（satellitepull.cnr.cn）实际是「吉林乡村广播」。
  # 识别分两道：① 分片容器是 WebM/Ogg/AAC 等纯音频格式；
  #             ② 码率低于 audio_max_kbps 且没有分辨率声明（cnr.cn 的广播流
  #                是 TS 容器，光看容器跟视频一样，只能靠码率区分）。
  drop_audio: true
  audio_max_kbps: 400      # 视频频道不可能低于这个码率，低于即为广播
  skipped_schemes: [rtmp, rtsp, udp, rtp, mms, rtmpi]   # 无法用 HTTP 探测的协议

  # ---------- 带宽测速（解决「卡」的关键）----------
  # 光验证「能拉到分片」不够：一个 200kbps 的源也能通过，但根本没法看。
  # 这里会连续下载若干分片，实测出下载速度和视频码率，然后用 speed/bitrate 的
  # 余量来排序。余量 >= 2 基本不会卡。
  bw_segments: 2            # 每个流连续拉几个分片（2 个就够判断稳定性）
  bw_sample_bytes: 700000   # 每个流总共最多下载多少字节（约 0.68MB）
  min_speed_kbps: 800       # 实测速度低于此值直接判死；嫌频道少就调到 400
  bw_enabled: true          # 流量吃紧可关掉（关掉后退回「只验证能出流」）
  # 测速并发。太高会把自己家宽带占满导致测得不准，太低则很慢。
  # 16 并发 × 3Mbps ≈ 48Mbps，百兆宽带留得下余量；50M 以下请改成 8。
  # 用本仓库自带的 tools/speedtest.py 可以量出自己这条线到底多宽。
  bw_concurrency: 16
  # 单条流测速的墙钟上限。这个值必须 >= 「拉清单 + 下完 bw_sample_bytes」，
  # 否则会出现「预算不够 → 被外层取消 → 已测到的数据一起丢 → 好源被误判成超时」。
  #
  # 曾经设 12 秒，而内层要连测 2 个分片、每个软超时 8 秒，最坏 16 秒，
  # 结果是 122 条流被判「整体超时(>12s)」，其中央视 26 条、卫视 26 条 —— 
  # 央视/卫视频道数直接腰斩。现在内层会按剩余预算主动收工，
  # 这里只要留够「683KB + 拉清单」的余量即可：
  #   800kbps 需 6.8s，400kbps 需 13.7s（会被 min_speed_kbps 正确剔除，而不是误报超时）
  bw_total_timeout: 18

# ---------------------------------------------------------------
# 6.1 自动源发现（每轮自动搜一遍全网有没有新的好源）
# ---------------------------------------------------------------
# 公开源寿命短，手工列表过几个月就会失效，而新源不断冒出来。
# 开了这个之后每轮会：
#   1. 测试 config/source_registry.yaml 里的候选源
#   2. 去 GitHub 搜最近还在更新的 IPTV 仓库，把它里面的 .m3u 拿来测
#   3. 新覆盖频道数达标的，流**当场并入本轮**（不用等下次）
#   4. 连续达标 → 记入 data/source_stats.json 常驻，以后每轮直接采集
#      连续没价值 / 拉不动 → 自动停用
# 往注册表里加源是零风险的：好用的自动留下，没用的自动淘汰。
discover:
  enabled: true
  registry: config/source_registry.yaml
  # 已自动常驻的源记在这里，按需可手工编辑（把 enabled 改成 false 即可停用）
  stats: data/source_stats.json

  # ---------- GitHub 自动搜源 ----------
  # CI 里会自动带上 GITHUB_TOKEN 走 5000 次/小时的额度；
  # 本机没配 token 也能跑，只是额度低（60 次/小时），超了会静默跳过。
  github_search: true
  github_token: ""                 # 留空则读环境变量 GITHUB_TOKEN
  github_queries:
    - "iptv in:name,description"
    - "iptv m3u in:name,description"
    - "直播源 in:name,description"
  github_pushed_within_days: 45    # 只搜这段时间内更新过的仓库
  github_repos: 12                 # 每轮最多看几个仓库
  files_per_repo: 2                # 每个仓库最多取几个 .m3u

  # ---------- 测试参数 ----------
  max_candidates: 40               # 每轮最多测几个候选，控制耗时
  concurrency: 8
  timeout: 12

  # ---------- 判定标准 ----------
  # new_channels = 相对现有源新覆盖的频道数（重复的源不算价值）
  min_new_channels: 3              # 新频道数低于这个值就算「没价值」
  # 新频道数也别太多：一次冒出上千个的，多半是巨型聚合列表
  # （实测碰到过 19000 条、凑出 967 个“新频道”的）。
  # 这种可以当轮取一部分，但不设为常驻——否则每轮都要采它，列表会被冲垮。
  max_new_channels: 400
  # 单个源本轮最多并入多少条流，避免一个巨型列表把探测量推高好几倍。
  max_merge_per_source: 120
  # 命中率 = 通过筛选的条数 ÷ 解析到的总条数。
  # 这是区分「对味的源」和「全量泛列表」的关键：
  # iptv-org 的 index.country（全国家列表）有 12525 条，能凑出 300 多个“新频道”，
  # 但命中率只有 3%——收进来只会让探测量翻几倍、还带一堆噪声。
  # 专做中文频道的列表命中率通常在 25%~70%。
  min_hit_rate: 0.15
  promote_after: 2                 # 连续 N 次达标 → 自动常驻
  demote_after: 3                  # 连续 N 次没价值/失败 → 自动停用
  auto_enable: true                # false = 只报告，不自动改动

# ---------------------------------------------------------------
# 6. 失效源剔除 / 自动复活
# ---------------------------------------------------------------
history:
  path: data/history.json
  blacklist_after: 4       # 连续失败 N 次 → 拉黑不再探测
  blacklist_hours: 72      # 冷却 N 小时后自动重新探测（可能复活）
  keep_days: 60            # 历史记录保留天数

# ---------------------------------------------------------------
# 7. 输出
# ---------------------------------------------------------------
output:
  dir: output
  main: live.m3u           # ★ 给电视订阅的主文件（每频道保留优质源）
  full: live_full.m3u      # 全部验证可用的源
  text: live.txt           # 纯 URL 列表，给 PotPlayer 手工测试用
  report: report.md
  index: index.html
  max_per_channel: 3       # 每个频道保留几个源（少留几条，减少电视端切源重试）
  max_channels: 0          # 0 = 不限制频道数
  min_keep_ratio: 0.5      # 断崖保护：新结果频道数不足上次 50% 时拒绝覆盖旧文件

  # ---------- 节目单（EPG）----------
  # 会被写进 m3u 的 #EXTM3U x-tvg-url="..."，由播放器自己去拉。
  #
  # 注意：原来写死的 https://live.fanmingming.cn/e.xml **已经连不上了**
  # （ConnectTimeout，可能改了域名或遭 DNS 污染），播放器上表现为「节目单加载失败」。
  #
  # 现在改成自己托管：每轮运行会把 EPG 下回到 output/e.xml，
  # 随 live.m3u 一起发布到 Pages，播放器直接取我们自己的域名（*.github.io 更稳）。
  # 逗号后面是第三方镜像兜底，支持多个 x-tvg-url 的播放器会依次尝试。
  # 自己托管的总开关见下面 epg_self_host / epg_mirrors。
  epg_url: "https://bswy311.github.io/myIPTV/e.xml,https://cdn.jsdelivr.net/gh/fanmingming/live@main/e.xml"

  # 是否把 EPG 下回来自己发布（推荐开着）
  epg_self_host: true
  # 按顺序尝试这些镜像，第一个成功的就用。
  # jsDelivr 是国内可达性最好的公共 CDN，放在第一位；
  # raw.githubusercontent.com 与 fanmingming 自家域名都实测不稳定，放后面。
  epg_mirrors:
    - https://cdn.jsdelivr.net/gh/fanmingming/live@main/e.xml
    - https://ghproxy.net/https://raw.githubusercontent.com/fanmingming/live/main/e.xml
    - https://gh-proxy.com/https://raw.githubusercontent.com/fanmingming/live/main/e.xml
    - https://raw.githubusercontent.com/fanmingming/live/main/e.xml
    - https://live.fanmingming.cn/e.xml

  # ---------- 台标 ----------
  # 源里没提供台标、或台标来自已失效的图床时，用这个模板按 tvg-id 拼一个。
  # 仅在 tvg-id 形如 CCTV1 / 北京卫视 时启用（这类台标确实存在）。
  logo_template: "https://live.fanmingming.com/tv/{id}.png"
  # true = 央视和卫视一律用上面的模板（统一好看）
  # false = 优先用源里自带的台标，只在缺失/失效时用模板
  logo_prefer_template: true
  # 这些图床/占位图已失效，遇到就换成上面的模板
  logo_skip_domains:
    - tv.haoqu99.com
    - notemp.gif
    - haoqu99

# ---------------------------------------------------------------
# 8. 局域网服务（给电视订阅 http://电脑IP:8899/live.m3u）
# ---------------------------------------------------------------
server:
  host: 0.0.0.0
  port: 8899
