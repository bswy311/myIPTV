name: update-iptv

on:
  # 每 6 小时自动跑一次（UTC 时间，可自行调整）
  schedule:
    - cron: "17 */6 * * *"
  # 支持手动触发
  workflow_dispatch:
  # 代码/配置变更时也跑一次
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-iptv
  cancel-in-progress: false

jobs:
  update:
    # 固定版本而不是 ubuntu-latest：
    # ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26，突发的基础镜像变更可能搞挂长跑任务。
    # 想跟新镜像时手动改这里即可。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑单元测试
        run: python tests/test_normalize.py

      - name: 采集 + 检测 + 剔除 + 发布
        run: python main.py run --no-progress --concurrency 120 --timeout 10

      - name: 提交历史库与输出结果
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只提交需要长期保留的产物。
          # data/raw.json 和 data/probed.json 是中间产物（已在 .gitignore 里），
          # 千万别用 `git add -f data`，那会把它们强推进仓库。
          git add output data/history.json data/last_run.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: 自动更新直播源 $(date -u +'%Y-%m-%d %H:%M UTC')"

          # 本机可能也在推，会撞车。被拒就同步远端后重试。
          # rebase 用 -X theirs：output/ 和 history 都是本次刚生成的，冲突时以本次为准。
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "推送成功（第 $attempt 次尝试）"
              exit 0
            fi
            echo "第 $attempt 次推送被拒，同步远端后重试 ..."
            git fetch origin main
            git rebase -X theirs origin/main
            sleep 5
          done

          echo "连续 3 次推送失败，请检查仓库权限或分支保护规则"
          exit 1

      - name: 配置 Pages
        uses: actions/configure-pages@v6
        with:
          # 关键：Pages 站点默认是不存在的，直接跑 getPagesSite 会 404。
          # enablement: true 会在首次运行时自动创建站点并把 Source 设为 GitHub Actions，
          # 省得去 Settings 里手动开。
          enablement: true

      - name: 打包 output 目录
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
